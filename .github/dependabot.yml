version: 2
updates:
  # Scan for new NuGet packages in the .NET project
  - package-ecosystem: "nuget"
    directory: "/Claims.Api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Scan for new GitHub Actions versions in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Scan for new Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"