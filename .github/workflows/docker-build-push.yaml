name: Reusable - Docker Build & Push

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
    outputs:
      short_sha:
        description: "The short git commit SHA used as image tag"
        value: ${{ jobs.build.outputs.short_sha }}

jobs:
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      # actions/checkout@v7
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # docker/login-action@v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/build-push-action@v6.15.0
      - name: Build and Push Docker Image
        uses: docker/build-push-action@471d1dc09d426509e628d2f19131aa80d22f87a3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ inputs.image-name }}:${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ inputs.image-name }}:latest