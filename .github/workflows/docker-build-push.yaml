name: Reusable - Docker Build & Push

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
    outputs:
      short_sha:
        description: "The short git commit SHA used as image tag"
        value: ${{ jobs.build.outputs.short_sha }}

jobs:
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      # actions/checkout@v7
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # docker/login-action@v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/build-push-action@v7.3.0
      - name: Build and Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ inputs.image-name }}:${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ inputs.image-name }}:latest