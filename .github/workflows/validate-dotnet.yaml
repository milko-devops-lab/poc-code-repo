name: Reusable - Validate .NET

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'

jobs:
  validate:
    name: Validate Code & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore Dependencies
        run: dotnet restore ./Claims.Api/Claims.Api.csproj

      - name: Build Solution
        run: dotnet build ./Claims.Api/Claims.Api.csproj --configuration Release --no-restore