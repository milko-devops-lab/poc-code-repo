name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main

# Enforce Principle of Least Privilege globally
permissions:
  contents: read
  packages: write

jobs:
  # 1. Validation & Testing - runs on PR and Push
  validate:
    name: Validate & Test
    uses: ./.github/workflows/validate-dotnet.yaml
    with:
      dotnet-version: '10.0.x'

  # 2. Docker Build & Push (only on Push to main)
  build-and-push:
    name: Containerize
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      image-name: ${{ github.repository_owner }}/claims-api

  # 3. GitOps Helm Bump (only on Push to main)
  promote-dev:
    name: GitOps Sync DEV
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gitops-helm-bump.yaml
    with:
      environment: dev
      config-repo: ${{ github.repository_owner }}/poc-config-repo
      values-file-path: 'helm/claims-api/values-dev.yaml'
      new-image-tag: ${{ needs.build-and-push.outputs.short_sha }}
    secrets:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
      private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

  promote-test:
    name: Promote to TEST
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gitops-helm-bump.yaml
    with:
      environment: test
      config-repo: ${{ github.repository_owner }}/poc-config-repo
      values-file-path: 'helm/claims-api/values-test.yaml'
      new-image-tag: ${{ needs.build-and-push.outputs.short_sha }}
    secrets:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
      private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

  promote-prod:
    name: Promote to PROD
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gitops-helm-bump.yaml
    with:
      environment: prod
      config-repo: ${{ github.repository_owner }}/poc-config-repo
      values-file-path: 'helm/claims-api/values-prod.yaml'
      new-image-tag: ${{ needs.build-and-push.outputs.short_sha }}
    secrets:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
      private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}