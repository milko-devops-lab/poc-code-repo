name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # 1. Валидация (изпълнява се ВИНАГИ - при PR и при Push)
  validate:
    name: Validate
    uses: ./.github/workflows/validate-dotnet.yaml
    with:
      dotnet-version: '10.0.x'

  # 2. Docker Build & Push (само при Push в main)
  build-and-push:
    name: Containerize
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      image-name: ${{ github.repository_owner }}/claims-api

  # 3. GitOps Helm Bump (само при Push в main)
  gitops-bump:
    name: GitOps Sync
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gitops-helm-bump.yaml
    with:
      config-repo: ${{ github.repository_owner }}/poc-config-repo
      values-file-path: 'helm/claims-api/values-dev.yaml'
      new-image-tag: ${{ needs.build-and-push.outputs.short_sha }}
    secrets:
      client-id: ${{ vars.CI_BOT_CLIENT_ID }}
      private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}